<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Académicos - Placar & Escores</title>
    <link rel="shortcut icon" type="image/x-icon" href="FCA.ico">
    <link rel="apple-touch-icon" href="academicos.png">
    <link rel="icon" type="image/png" sizes="192x192" href="academicos.png">
    <style>
        :root { 
            --primary: #000000; 
            --accent: #222222; 
            --bg: #f8f9fa; 
            --gray-light: #f1f3f5;
            --gray-border: #e2e8f0;
            --gray-dark: #64748b;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
            color: #111111;
        }

        .main-content { 
            width: 96%; 
            max-width: 900px; 
            margin: 25px auto; 
        }

        .container { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 16px; 
            border: 1px solid var(--gray-border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.02); 
            margin-bottom: 30px; 
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            border-bottom: 1px solid var(--gray-border); 
            padding-bottom: 20px; 
        }
        .header-logo { max-height: 40px; margin-right: 15px; }
        header h2 { font-weight: 800; letter-spacing: -0.5px; margin: 0; font-size: 1.1rem; color: var(--primary); }

        /* Filtros */
        .filter-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 16px; 
            background: var(--bg); 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid var(--gray-border); 
            margin-bottom: 25px; 
        }
        .field { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }
        .field label { 
            font-size: 10px; 
            font-weight: 800; 
            color: #000000; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, select { 
            padding: 10px 12px; 
            border: 1px solid var(--gray-border); 
            border-radius: 8px; 
            font-size: 13px; 
            background: #ffffff; 
            color: #000000;
            outline: none;
            transition: 0.2s;
        }
        input:focus, select:focus { border-color: #000000; }

        .btn-dark {
            padding: 10px 16px;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            height: 41px;
            align-self: flex-end;
        }
        .btn-dark:hover { background: var(--primary); }

        .secao-titulo {
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 25px 0 15px;
            color: #000000;
        }

        /* CARDS DE ESCORE (Padrão de Cores Preto/Cinza/Antracite do Site) */
        .escore-card {
            background: #ffffff;
            border: 1px solid var(--gray-border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .escore-topo-info {
            text-align: center;
            font-size: 11px;
            font-weight: 800;
            color: var(--gray-dark);
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .escore-sub-text {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: #111;
            margin-bottom: 10px;
        }
        .escore-barra-preta {
            background: #111111; /* Cor primária de destaque do seu tema */
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            color: #ffffff;
        }
        .time-bloco {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 40%;
        }
        .time-bloco.direita {
            justify-content: flex-end;
            text-align: right;
        }
        .time-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        .time-nome {
            font-weight: 800;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .placar-box-central {
            background: #ffffff;
            color: #000000;
            padding: 6px 18px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 2px;
        }
        .placar-box-pendente {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .escore-rodape {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--gray-dark);
            font-weight: 600;
        }
        .escore-parciais {
            font-weight: 700;
            color: #111111;
        }
        .sem-registos {
            text-align: center;
            padding: 20px;
            color: var(--gray-dark);
            font-size: 13px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px dashed var(--gray-border);
        }
        .load-more-container {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="main-content">
    <div class="container">
        <header>
            <div style="display: flex; align-items: center;">
                <img src="academicos.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
                <h2>FC Os Académicos - Placar & Escores</h2>
            </div>
            <div>
                <span style="font-size: 12px; color: var(--gray-dark); font-weight: bold;">⚡ Resultados & Próximos</span>
            </div>
        </header>

        <!-- FILTROS DE DATAS E TURNO -->
        <div class="filter-grid">
            <div class="field"><label>📅 Data Inicial</label><input type="date" id="filtroDataInicio" onchange="renderizarPlacares()"></div>
            <div class="field"><label>📅 Data Final</label><input type="date" id="filtroDataFim" onchange="renderizarPlacares()"></div>
            <div class="field"><label>⏰ Turno / Período</label>
                <select id="filtroTurno" onchange="renderizarPlacares()">
                    <option value="">Todos os turnos</option>
                    <option value="manha">Manhã (antes das 12h)</option>
                    <option value="tarde">Tarde (12h às 18h)</option>
                    <option value="noite">Noite (após 18h)</option>
                </select>
            </div>
            <button class="btn-dark" onclick="limparFiltros()">Limpar Filtros</button>
        </div>

        <!-- LISTA UNIFICADA DE PLACARES (PASSADOS E FUTUROS) -->
        <div id="listaPlacares"></div>

        <!-- BOTÃO CARREGAR MAIS -->
        <div class="load-more-container" id="containerBtnMais" style="display:none;">
            <button class="btn-dark" onclick="carregarMaisJogos()" style="width: 100%; align-self: center;">Carregar Mais Jogos (+5)</option>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyB86TeZnp2qdOXXwjvD3hFfzTi3Z3NkVMc", authDomain: "academicos-d2cfc.firebaseapp.com", projectId: "academicos-d2cfc", storageBucket: "academicos-d2cfc.firebasestorage.app", messagingSenderId: "550824625713", appId: "1:550824625713:web:f3194f8e4f06dc141a3710" };
    const app = initializeApp(firebaseConfig); 
    const db = getFirestore(app); 
    const jogosCol = collection(db, "jogos");

    let todosOsJogos = [];
    let limiteExibicao = 10; // Começa mostrando 10 (5 para trás e 5 para frente)

    const logosClubes = {
        "Académicos": "academicos.png",
        "FC Os Académicos": "academicos.png",
        "CAM B": "academicos.png",
        "FGVC": "academicos.png",
        "SCP": "academicos.png",
        "FCOA": "academicos.png"
    };

    function obterLogo(nomeClube) {
        if (!nomeClube) return "academicos.png";
        return logosClubes[nomeClube.trim()] || "academicos.png";
    }

    onSnapshot(query(jogosCol, orderBy("data"), orderBy("hora")), (snapshot) => {
        todosOsJogos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        
        // Se for a primeira carga e não houver datas selecionadas, tenta posicionar o limite para mostrar os próximos e recentes
        renderizarPlacares();
    });

    window.renderizarPlacares = function() {
        const container = document.getElementById('listaPlacares');
        const btnMaisContainer = document.getElementById('containerBtnMais');
        container.innerHTML = '';

        const fInicio = document.getElementById('filtroDataInicio').value;
        const fFim = document.getElementById('filtroDataFim').value;
        const fTurno = document.getElementById('filtroTurno').value;

        const hojeStr = new Date().toISOString().split('T')[0];

        // Filtra os jogos com base nos critérios de data e turno
        let jogosFiltrados = todosOsJogos.filter(j => {
            if (!j.data) return false;
            if (fInicio && j.data < fInicio) return false;
            if (fFim && j.data > fFim) return false;

            if (fTurno && j.hora) {
                const horaInt = parseInt(j.hora.split(':')[0]);
                if (fTurno === 'manha' && horaInt >= 12) return false;
                if (fTurno === 'tarde' && (horaInt < 12 || horaInt >= 18)) return false;
                if (fTurno === 'noite' && horaInt < 18) return false;
            }
            return true;
        });

        // Se o utilizador não aplicou filtro manual de data, separamos inteligentemente: 
        // 5 jogos passados mais recentes + 5 jogos futuros seguintes.
        if (!fInicio && !fFim) {
            let passados = jogosFiltrados.filter(j => j.data < hojeStr || (j.data === hojeStr && j.finalizado));
            let futuros = jogosFiltrados.filter(j => j.data >= hojeStr && !j.finalizado);

            // Ordena os passados do mais antigo para o mais recente ou vice-versa, e pega os últimos
            passados.sort((a,b) => new Date(b.data) - new Date(new Date(a.data)));
            let ultimosPassados = passados.slice(0, Math.min(5, passados.length)).reverse();

            let proximosFuturos = futuros.slice(0, Math.max(5, limiteExibicao - ultimosPassados.length));

            // Junta para exibição baseada no limite atual
            jogosFiltrados = [...ultimosPassados, ...proximosFuturos];
        }

        const visiveis = jogosFiltrados.slice(0, limiteExibicao);

        if (visiveis.length === 0) {
            container.innerHTML = `<div class="sem-registos">Nenhum jogo encontrado com os filtros selecionados.</div>`;
            btnMaisContainer.style.display = 'none';
            return;
        }

        visiveis.forEach(j => {
            let timeCasaNome = j.casaFora === 'Casa' ? 'FC Académicos' : (j.adversario || 'Adversário');
            let timeForaNome = j.casaFora === 'Fora' ? 'FC Académicos' : (j.adversario || 'Adversário');
            let logoCasaImg = j.casaFora === 'Casa' ? obterLogo('Académicos') : obterLogo(j.adversario);
            let logoForaImg = j.casaFora === 'Fora' ? obterLogo('Académicos') : obterLogo(j.adversario);
            let dtFormatada = j.data ? j.data.split('-').reverse().join('/') : '';

            const card = document.createElement('div');
            card.className = 'escore-card';

            if (j.finalizado || j.data < hojeStr) {
                // CARD DE JOGO REALIZADO / COM RESULTADO
                card.innerHTML = `
                    <div class="escore-topo-info">${j.escalao || 'Escalão'} • ${dtFormatada}</div>
                    <div class="escore-sub-text">${j.treinador || 'Treinador'} ${j.competicao ? '• ' + j.competicao : ''}</div>
                    <div class="escore-barra-preta">
                        <div class="time-bloco">
                            <img src="${logoCasaImg}" class="time-logo" onerror="this.style.display='none'">
                            <span class="time-nome">${timeCasaNome}</span>
                        </div>
                        <div class="placar-box-central">
                            ${j.setPro !== undefined ? j.setPro : '0'} - ${j.setContra !== undefined ? j.setContra : '0'}
                        </div>
                        <div class="time-bloco direita">
                            <span class="time-nome">${timeForaNome}</span>
                            <img src="${logoForaImg}" class="time-logo" onerror="this.style.display='none'">
                        </div>
                    </div>
                    <div class="escore-rodape">
                        <span class="escore-parciais">Parciais: ${j.parciais || '---'}</span>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="font-size: 13px;">📊</span>
                            <span style="font-size: 12px; color: #e53e3e; font-weight: 700;">♥ 0</span>
                        </div>
                    </div>
                `;
            } else {
                // CARD DE JOGO FUTURO (AGUARDANDO)
                card.innerHTML = `
                    <div class="escore-topo-info">${j.escalao || 'Escalão'} • ${dtFormatada} às ${j.hora || ''}</div>
                    <div class="escore-sub-text">${j.treinador || ''} ${j.competicao ? '• ' + j.competicao : ''}</div>
                    <div class="escore-barra-preta">
                        <div class="time-bloco">
                            <img src="${logoCasaImg}" class="time-logo" onerror="this.style.display='none'">
                            <span class="time-nome">${timeCasaNome}</span>
                        </div>
                        <div class="placar-box-pendente">
                            EM BREVE
                        </div>
                        <div class="time-bloco direita">
                            <span class="time-nome">${timeForaNome}</span>
                            <img src="${logoForaImg}" class="time-logo" onerror="this.style.display='none'">
                        </div>
                    </div>
                    <div class="escore-rodape">
                        <span>📍 ${j.pavilhao || 'Local a definir'}</span>
                        <span style="font-size: 11px; font-weight: 700; color: #64748b;">${j.casaFora || ''}</span>
                    </div>
                `;
            }
            container.appendChild(card);
        });

        // Mostra ou oculta o botão de carregar mais
        if (visiveis.length < jogosFiltrados.length && (!fInicio && !fFim)) {
            btnMaisContainer.style.display = 'block';
        } else {
            btnMaisContainer.style.display = 'none';
        }
    }

    window.carregarMaisJogos = function() {
        limiteExibicao += 5;
        renderizarPlacares();
    }

    window.limparFiltros = function() {
        document.getElementById('filtroDataInicio').value = '';
        document.getElementById('filtroDataFim').value = '';
        document.getElementById('filtroTurno').value = '';
        limiteExibicao = 10;
        renderizarPlacares();
    }
</script>
</body>
</html>
