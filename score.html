<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Académicos - Painel de Escore</title>
    <link rel="shortcut icon" type="image/x-icon" href="FCA.ico">
    <link rel="apple-touch-icon" href="academicos.png">
    <link rel="icon" type="image/png" sizes="192x192" href="academicos.png">
    <style>
        :root { 
            --primary: #000000; 
            --accent: #222222; 
            --bg: #f8f9fa; 
            --gray-border: #e2e8f0;
            --gray-dark: #64748b;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
            color: #111111;
        }

        .main-content { 
            width: 96%; 
            max-width: 900px; 
            margin: 25px auto; 
        }

        .container { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 16px; 
            border: 1px solid var(--gray-border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.02); 
            margin-bottom: 30px; 
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            border-bottom: 1px solid var(--gray-border); 
            padding-bottom: 20px; 
        }
        .header-logo { max-height: 40px; margin-right: 15px; }
        header h2 { font-weight: 800; letter-spacing: -0.5px; margin: 0; font-size: 1.2rem; }

        .secao-titulo {
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 25px 0 15px;
            color: #000000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* CARD DE ESCORE / PLACAR (ESTILO REFERÊNCIA) */
        .escore-card {
            background: #ffffff;
            border: 1px solid var(--gray-border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }
        .escore-card:hover {
            transform: translateY(-2px);
        }
        .escore-topo-info {
            text-align: center;
            font-size: 11px;
            font-weight: 800;
            color: var(--gray-dark);
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .escore-sub-text {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: #111;
            margin-bottom: 10px;
        }
        .escore-barra-verde {
            background: #0e3b21; /* Verde escuro padrão da identidade */
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            color: #ffffff;
        }
        .time-bloco {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 40%;
        }
        .time-bloco.direita {
            justify-content: flex-end;
            text-align: right;
        }
        .time-logo {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        .time-nome {
            font-weight: 800;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .placar-box-central {
            background: #ffffff;
            color: #000000;
            padding: 6px 18px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 2px;
        }
        .placar-box-pendente {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .escore-rodape {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--gray-dark);
            font-weight: 600;
        }
        .escore-parciais {
            font-weight: 700;
            color: #111111;
        }
        .sem-registos {
            text-align: center;
            padding: 20px;
            color: var(--gray-dark);
            font-size: 13px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px dashed var(--gray-border);
        }
    </style>
</head>
<body>

<div class="main-content">
    <div class="container">
        <header>
            <div style="display: flex; align-items: center;">
                <img src="academicos.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
                <h2>FC Os Académicos - Placar & Escores</h2>
            </div>
            <div>
                <span style="font-size: 12px; color: var(--gray-dark); font-weight: bold;">⚡ Atualização Automática</span>
            </div>
        </header>

        <!-- SEÇÃO: JOGOS FUTUROS (AGUARDANDO) -->
        <div class="secao-titulo">📅 Próximos Jogos (Aguardando)</div>
        <div id="listaFuturos"></div>

        <!-- SEÇÃO: ÚLTIMOS RESULTADOS (10 DIAS PARA TRÁS) -->
        <div class="secao-titulo" style="margin-top: 35px;">📜 Últimos Resultados (Últimos 10 Dias)</div>
        <div id="listaHistoricoRecente"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyB86TeZnp2qdOXXwjvD3hFfzTi3Z3NkVMc", authDomain: "academicos-d2cfc.firebaseapp.com", projectId: "academicos-d2cfc", storageBucket: "academicos-d2cfc.firebasestorage.app", messagingSenderId: "550824625713", appId: "1:550824625713:web:f3194f8e4f06dc141a3710" };
    const app = initializeApp(firebaseConfig); 
    const db = getFirestore(app); 
    const jogosCol = collection(db, "jogos");

    // Dicionário de Logos dos Clubes
    const logosClubes = {
        "Académicos": "academicos.png",
        "FC Os Académicos": "academicos.png",
        "CAM B": "academicos.png",
        "FGVC": "academicos.png",
        "SCP": "academicos.png",
        "FCOA": "academicos.png"
    };

    function obterLogo(nomeClube) {
        if (!nomeClube) return "academicos.png";
        return logosClubes[nomeClube.trim()] || "academicos.png";
    }

    onSnapshot(query(jogosCol, orderBy("data"), orderBy("hora")), (snapshot) => {
        const listaFuturosEl = document.getElementById('listaFuturos');
        const listaHistoricoEl = document.getElementById('listaHistoricoRecente');

        listaFuturosEl.innerHTML = '';
        listaHistoricoEl.innerHTML = '';

        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);

        // Define a data limite de 10 dias atrás
        const dezDiasAtras = new Date();
        dezDiasAtras.setDate(hoje.getDate() - 10);
        dezDiasAtras.setHours(0, 0, 0, 0);

        let qtdFuturos = 0;
        let qtdHistorico = 0;

        snapshot.docs.forEach(doc => {
            const j = doc.data();
            if (!j.data) return;

            const dataJogo = new Date(j.data + 'T00:00:00');

            // Nomes e Logos configurados para Casa e Fora
            let timeCasaNome = j.casaFora === 'Casa' ? 'FC Académicos' : (j.adversario || 'Adversário');
            let timeForaNome = j.casaFora === 'Fora' ? 'FC Académicos' : (j.adversario || 'Adversário');
            let logoCasaImg = j.casaFora === 'Casa' ? obterLogo('Académicos') : obterLogo(j.adversario);
            let logoForaImg = j.casaFora === 'Fora' ? obterLogo('Académicos') : obterLogo(j.adversario);
            let dtFormatada = j.data.split('-').reverse().join('/');

            // 1. JOGOS FUTUROS OU HOJE (Aguardando)
            if (!j.finalizado && dataJogo >= hoje) {
                qtdFuturos++;
                const card = document.createElement('div');
                card.className = 'escore-card';
                card.innerHTML = `
                    <div class="escore-topo-info">${j.escalao || 'Escalão'} • ${dtFormatada} às ${j.hora || ''}</div>
                    <div class="escore-sub-text">${j.treinador || ''} ${j.competicao ? '• ' + j.competicao : ''}</div>
                    <div class="escore-barra-verde">
                        <div class="time-bloco">
                            <img src="${logoCasaImg}" class="time-logo" onerror="this.style.display='none'">
                            <span class="time-nome">${timeCasaNome}</span>
                        </div>
                        <div class="placar-box-pendente">
                            EM BREVE
                        </div>
                        <div class="time-bloco direita">
                            <span class="time-nome">${timeForaNome}</span>
                            <img src="${logoForaImg}" class="time-logo" onerror="this.style.display='none'">
                        </div>
                    </div>
                    <div class="escore-rodape">
                        <span>📍 ${j.pavilhao || 'Local a definir'}</span>
                        <span style="font-size: 11px; font-weight: 700; color: #64748b;">${j.casaFora || ''}</span>
                    </div>
                `;
                listaFuturosEl.appendChild(card);
            }

            // 2. JOGOS FINALIZADOS OU DOS ÚLTIMOS 10 DIAS PARA TRÁZ
            if (j.finalizado || (dataJogo >= dezDiasAtras && dataJogo < hoje)) {
                // Se o jogo já passou mas esqueceram de marcar como finalizado, exibe os dados salvos ou placeholder
                qtdHistorico++;
                const card = document.createElement('div');
                card.className = 'escore-card';
                card.innerHTML = `
                    <div class="escore-topo-info">${j.escalao || 'Escalão'}</div>
                    <div class="escore-sub-text">${j.treinador || 'Treinador'} • ${dtFormatada}</div>
                    <div class="escore-barra-verde">
                        <div class="time-bloco">
                            <img src="${logoCasaImg}" class="time-logo" onerror="this.style.display='none'">
                            <span class="time-nome">${timeCasaNome}</span>
                        </div>
                        <div class="placar-box-central">
                            ${j.setPro !== undefined ? j.setPro : '0'} - ${j.setContra !== undefined ? j.setContra : '0'}
                        </div>
                        <div class="time-bloco direita">
                            <span class="time-nome">${timeForaNome}</span>
                            <img src="${logoForaImg}" class="time-logo" onerror="this.style.display='none'">
                        </div>
                    </div>
                    <div class="escore-rodape">
                        <span class="escore-parciais">Parciais: ${j.parciais || '---'}</span>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="font-size: 13px;">📊</span>
                            <span style="font-size: 12px; color: #e53e3e; font-weight: 700;">♥ 0</span>
                        </div>
                    </div>
                `;
                listaHistoricoEl.appendChild(card);
            }
        });

        if (qtdFuturos === 0) {
            listaFuturosEl.innerHTML = `<div class="sem-registos">Nenhum jogo futuro agendado no momento.</div>`;
        }
        if (qtdHistorico === 0) {
            listaHistoricoEl.innerHTML = `<div class="sem-registos">Nenhum resultado registado nos últimos 10 dias.</div>`;
        }
    });
</script>
</body>
</html>
